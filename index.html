<style>
:root{
  color-scheme:light;
  --bg:#f3f5f2; --surface:#ffffff; --ink:#13231e; --muted:#566660; --line:#d9e0db;
  --brand:#0e5a47; --brand-ink:#ffffff; --brass:#85590a; --brass-soft:#f4e9cf;
  --ok:#17724a; --ok-bg:#dff3e8; --warn:#7a5200; --warn-bg:#fbebc8; --bad:#a3302a; --bad-bg:#f8dcda;
  --font-display:'Reem Kufi','Tajawal',system-ui,sans-serif;
  --font-body:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  color-scheme:dark;
  --bg:#0d1613; --surface:#142019; --ink:#e7efea; --muted:#9bada5; --line:#243630;
  --brand:#46b894; --brand-ink:#06231a; --brass:#e0b04f; --brass-soft:#3a2f14;
  --ok:#6fd6a3; --ok-bg:#12382a; --warn:#f0c060; --warn-bg:#3b2d0c; --bad:#f19a94; --bad-bg:#3d1b19}}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{
  margin:0;background:var(--bg);color:var(--ink);direction:rtl;
  font:400 16px/1.6 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:96px;
}
body[dir="ltr"]{direction:ltr;--font-display:'Tajawal',system-ui,sans-serif}
.wrap{max-width:560px;margin-inline:auto}
h1,h2,h3{font-family:var(--font-display);font-weight:700;line-height:1.3;margin:0;text-wrap:balance}
h1{font-size:1.65rem} h2{font-size:1.2rem} h3{font-size:1.08rem}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

.top{position:sticky;top:0;z-index:9;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.top .wrap{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:700 1.35rem var(--font-display);color:var(--brand)}
.brand svg{width:28px;height:28px;stroke:var(--brand);fill:none;stroke-width:2}
.langbtn{margin-inline-start:auto;min-height:40px;padding:4px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}

main{padding-block:20px 8px;display:flex;flex-direction:column;gap:20px}
.lead{color:var(--muted);margin-top:4px}

.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label,.lbl{font-weight:500;font-size:.95rem}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{
  width:100%;min-height:48px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--ink)}
textarea{min-height:92px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2>*{min-width:0}
@media (max-width:420px){.grid2.stack{grid-template-columns:1fr}}
.err{color:var(--bad);font-size:.9rem}
.hint{color:var(--muted);font-size:.9rem}
.okbox{color:var(--ok);background:var(--ok-bg);padding:10px 12px;border-radius:12px;font-size:.95rem}
.errbox{color:var(--bad);background:var(--bad-bg);padding:10px 12px;border-radius:12px;font-size:.95rem}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);font-weight:700;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.small{min-height:40px;padding:6px 14px;font-size:.92rem}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--brand);font-weight:700;cursor:pointer;text-align:start;min-height:40px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:4px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.9rem}
button.chip{cursor:pointer;min-height:40px}
button.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.82rem;font-weight:700}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.muted{background:var(--line);color:var(--muted)}

.list{display:flex;flex-direction:column;gap:16px}
.card{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card .art,.card .photo,.media .art,.media .photo{display:block;width:100%;height:150px;object-fit:cover}
.media .art,.media .photo{height:210px}
.card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.card .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.loc{color:var(--muted);font-size:.95rem}
.price{font:700 1.2rem var(--font-display);color:var(--brass)}
.price small{font:400 .85rem var(--font-body);color:var(--muted)}
.count{color:var(--muted);font-size:.92rem}
.empty{border:1px dashed var(--line);border-radius:16px;padding:24px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.note{color:var(--muted);font-size:.88rem;border-top:1px solid var(--line);padding-top:14px}

.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;min-height:40px}
.back svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.media{border-radius:16px;overflow:hidden}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-block:1px solid var(--line);padding-block:14px}
.facts div{min-width:0}
.facts span{display:block;color:var(--muted);font-size:.88rem}
.facts b{font:700 1.15rem var(--font-display)}
.sec{display:flex;flex-direction:column;gap:12px}
.sec+.sec{border-top:1px solid var(--line);padding-top:20px}

.cal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head b{font:700 1.05rem var(--font-display)}
.cal-head button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;cursor:pointer}
.cal-head button:disabled{opacity:.35;cursor:not-allowed}
.cal-head svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2}
.dows,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dows span{text-align:center;color:var(--muted);font-size:.8rem;padding-block:4px}
.day{aspect-ratio:1;min-height:40px;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;font-variant-numeric:tabular-nums}
.day:hover:not(:disabled){border-color:var(--brand)}
.day.today{border-color:var(--muted)}
.day.past{color:var(--muted);opacity:.4;cursor:default}
.day.busy{background:var(--bad-bg);color:var(--bad);text-decoration:line-through;cursor:not-allowed}
.day.sel{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.85rem;margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-inline-end:6px;vertical-align:-1px}
.seldate{font-weight:700}

.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.item .row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.item dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:.95rem}
.item dt{color:var(--muted)} .item dd{margin:0;min-width:0;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.sub{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.code{font-variant-numeric:tabular-nums;letter-spacing:.04em;color:var(--muted);font-size:.88rem}
.photo-prev{width:100%;max-height:180px;object-fit:cover;border-radius:12px}
.blocked{display:flex;gap:8px;flex-wrap:wrap}
.flash{outline:2px solid var(--brand)}
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.92rem}
.who bdi{overflow-wrap:anywhere}

.tabs{position:fixed;inset:auto 0 0;z-index:9;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.tabs div{max-width:560px;margin-inline:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:12px;text-decoration:none;color:var(--muted);font-size:.8rem;min-height:52px;justify-content:center;text-align:center}
.tabs a[aria-current="page"]{color:var(--brand);font-weight:700;background:var(--brass-soft)}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

#toast{position:fixed;inset:auto 0 calc(84px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:max-content;max-width:calc(100% - 32px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:20}
#toast.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

.sig{max-width:560px;margin:8px auto 0;padding-top:18px;text-align:center;direction:ltr}
.sig-name{font:400 2.6rem/1.1 'Great Vibes','Brush Script MT',cursive;letter-spacing:.04em;
  background:linear-gradient(135deg,#8a5d08 0%,#d9a93a 35%,#f3d58a 50%,#c48f1f 70%,#8a5d08 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;display:inline-block;padding-inline:6px}
.sig-heart{display:block;width:14px;height:14px;margin:0 auto 6px;fill:#c9972b}
.sig-lines{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:4px}
.sig-lines i{display:block;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#c9972b,transparent)}
.sig-lines i:first-child{width:96px}.sig-lines i:last-child{width:56px}
@media (prefers-color-scheme: dark){.sig-name{background:linear-gradient(135deg,#c48f1f 0%,#f0cb70 40%,#fff0c2 52%,#e0b04f 70%,#b98a22 100%);-webkit-background-clip:text;background-clip:text}}
</style>

/* ---------- rendering + router ---------- */
var app=$('#app'),cur='';
function view(){var h=location.hash.slice(1)||'halls';return h.indexOf('hall-')===0?'hall':(h==='bookings'||h==='owner'?h:'halls')}
function render(keepScroll){
  var ae=document.activeElement,fid=(ae&&ae!==document.body&&ae.id)?ae.id:'',ss=null,se=null,y=window.scrollY;
  try{if(ae&&typeof ae.selectionStart==='number'){ss=ae.selectionStart;se=ae.selectionEnd}}catch(e){}
  var v=view(),html;
  try{
    html=!sb?vSetup():v==='hall'?vHall():v==='bookings'?vBookings():v==='owner'?vOwner():vHalls();
  }catch(err){
    if(window.console)console.error(err);
    html='<div class="empty"><h3>'+t('eNet')+'</h3></div>';
  }
  app.innerHTML=html;
  var tab=v==='hall'?'halls':v;
  document.querySelectorAll('.tabs a').forEach(function(a){if(a.dataset.tab===tab)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  if(fid){var el=document.getElementById(fid);if(el&&el!==document.activeElement){try{el.focus({preventScroll:true});if(ss!=null&&typeof el.setSelectionRange==='function'&&/^(text|tel|password|search)$/.test(el.type)&&el.tagName==='INPUT')el.setSelectionRange(ss,se)}catch(e){}}}
  window.scrollTo(0,keepScroll===false?0:y);
}
function refreshResults(){var r=$('#results');if(r)r.innerHTML=results()}
function route(){
  var h=location.hash.slice(1)||'halls',changed=h!==cur;
  if(changed){cur=h;S.arm='';enter(view(),h)}
  render(!changed);
}
function enter(v,h){
  if(!sb)return;
  if(v==='halls'){if(S.hallsState!=='ok'&&S.hallsState!=='loading')loadHalls()}
  else if(v==='hall'){
    var id=h.slice(5);S.hallId=id;S.hall=null;S.busy={};S.sel='';S.err={};S.sending=false;S.cal={y:now.getFullYear(),m:now.getMonth()};
    loadHall(id);
  }
  else if(v==='bookings')loadMy();
  else if(v==='owner'&&S.user)loadOwner();
}
window.addEventListener('hashchange',route);

/* ---------- data: halls ---------- */
function loadHalls(){
  S.hallsState='loading';
  sb.from('halls_public').select('*').order('created_at',{ascending:false}).limit(500).then(function(r){
    if(r.error){S.hallsState='err'}else{S.halls=r.data||[];S.hallsState='ok'}
    if(view()==='halls')render();
  },function(){S.hallsState='err';if(view()==='halls')render()});
}
function loadBusyOn(d){
  S.busyIds=null;S.busyFor=d;
  if(!d){refreshResults();return}
  refreshResults();
  sb.rpc('busy_halls_on',{p_date:d}).then(function(r){
    if(S.busyFor!==d)return;
    S.busyIds={};
    if(r.error)toast(t('eNet'));else(r.data||[]).forEach(function(x){S.busyIds[scalar(x)]=true});
    refreshResults();
  },function(){if(S.busyFor!==d)return;S.busyIds={};toast(t('eNet'));refreshResults()});
}
function loadHall(id){
  if(!UUID.test(id)){S.hallState='nf';return}
  S.hallState='loading';
  Promise.all([sb.from('halls_public').select('*').eq('id',id).maybeSingle(),sb.rpc('busy_dates',{p_hall:id})]).then(function(rs){
    if(S.hallId!==id)return;
    var a=rs[0],b=rs[1];
    if(a.error||b.error){S.hallState='err'}
    else if(!a.data){S.hallState='nf'}
    else{S.hall=a.data;S.busy={};(b.data||[]).forEach(function(x){S.busy[scalar(x)]=true});S.hallState='ok'}
    if(view()==='hall')render();
  },function(){if(S.hallId!==id)return;S.hallState='err';if(view()==='hall')render()});
}

function loadMy(){
  var my=getMy();
  if(!my.length){S.my=[];S.myState='ok';return}
  S.myState='loading';
  var byPhone={};
  my.forEach(function(x){(byPhone[x.phone]=byPhone[x.phone]||[]).push(x.code)});
  var ps=Object.keys(byPhone).map(function(ph){return sb.rpc('track_bookings',{p_phone:ph,p_codes:byPhone[ph]})});

    var rows=[],bad=false;
    rs.forEach(function(r){if(r.error)bad=true;else rows=rows.concat(r.data||[])});
    rows.sort(function(a,b){return a.r_created<b.r_created?1:-1});

var baseUrl=function(){return location.href.split('#')[0].split('?')[0]};
var hadCode=/[?&]code=/.test(location.search);
function setUser(sess){
  var u=(sess&&sess.user)||null,changed=(u?u.id:'')!==(S.user?S.user.id:'');
  S.user=u;
  if(changed){S.oh=[];S.ob=[];S.oState='idle';S.adding=false;S.editing='';S.of=blankForm();S.oerr={};S.arm='';if(u&&view()==='owner')loadOwner()}

function authErr(e){
  var m=String(e&&e.message||'').toLowerCase();
  if(m.indexOf('invalid login')>-1)return t('eLogin');
  if(m.indexOf('not confirmed')>-1)return t('eConfirm');
  if(m.indexOf('already registered')>-1||m.indexOf('already been registered')>-1)return t('eExists');
  if(m.indexOf('rate limit')>-1||m.indexOf('too many')>-1||m.indexOf('security purposes')>-1)return t('eAuthRate');
  if(m.indexOf('password')>-1&&(m.indexOf('least')>-1||m.indexOf('weak')>-1||m.indexOf('short')>-1))return t('ePw');
  return t('eNet');
}
function initAuth(){
  sb.auth.onAuthStateChange(function(ev,sess){
    if(ev==='TOKEN_REFRESHED')return;
    /* لا نستعمل await على Supabase داخل هذه الدالة: نؤجّل العمل */
    setTimeout(function(){
      if(ev==='PASSWORD_RECOVERY'){S.au.mode='recover';S.au.err='';S.au.info=''}
      setUser(sess);S.authReady=true;
      if(hadCode&&/[?&]code=/.test(location.search)&&(ev==='SIGNED_IN'||ev==='INITIAL_SESSION'||ev==='PASSWORD_RECOVERY')){
        try{history.replaceState(null,'',location.pathname+location.hash)}catch(e){}
      }
      if((ev==='SIGNED_IN'||ev==='PASSWORD_RECOVERY')&&hadCode&&view()!=='owner'){hadCode=false;location.hash='owner';return}
      render();
    },0);
  });
  sb.auth.getSession().then(function(r){
    if(!S.authReady){setUser(r&&r.data&&r.data.session);S.authReady=true;render()}
  },function(){if(!S.authReady){S.authReady=true;render()}});
}
function doAuth(){
  var a=S.au;if(a.busy)return;
  a.err='';a.info='';
  var email=a.email.trim();
  if(a.mode!=='recover'&&!/^\S+@\S+\.\S+$/.test(email)){a.err=t('eEmail');render();return}
  if(a.mode==='login'&&!a.pw){a.err=t('ePwEmpty');render();return}
  if((a.mode==='signup'||a.mode==='recover')&&a.pw.length<8){a.err=t('ePw');render();return}
  a.busy=true;render();
  var done=function(){a.busy=false;render()},fail=function(){a.err=t('eNet');done()};
  if(a.mode==='login'){
    sb.auth.signInWithPassword({email:email,password:a.pw}).then(function(r){
      if(r.error)a.err=authErr(r.error);else{a.pw='';toast(t('tLogged'))}
      done();
    },fail);
  }else if(a.mode==='signup'){
    sb.auth.signUp({email:email,password:a.pw,options:{emailRedirectTo:baseUrl()}}).then(function(r){
      if(r.error)a.err=authErr(r.error);
      else if(r.data&&r.data.session){a.pw='';toast(t('tLogged'))}
      else if(r.data&&r.data.user&&r.data.user.identities&&r.data.user.identities.length===0)a.err=t('eExists');
      else{a.info=t('iConfirm');a.mode='login';a.pw=''}
      done();
    },fail);
  }else if(a.mode==='forgot'){
    sb.auth.resetPasswordForEmail(email,{redirectTo:baseUrl()}).then(function(r){
      if(r.error&&authErr(r.error)!==t('eNet'))a.err=authErr(r.error);else a.info=t('iReset');
      done();
    },fail);
  }else if(a.mode==='recover'){
    sb.auth.updateUser({password:a.pw}).then(function(r){
      if(r.error)a.err=authErr(r.error);else{a.pw='';a.mode='login';toast(t('tPwSaved'));if(S.user&&view()==='owner')loadOwner()}
      done();
    },fail);
  }
}

/* ---------- photos ---------- */
function compress(file,cb){
  if(!file||file.size>20*1024*1024){cb(null);return}
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var k=Math.min(1,1200/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));
      var ctx=c.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);
      if(c.toBlob)c.toBlob(function(b){cb(b||null)},'image/jpeg',.8);else cb(null);
    };
    img.onerror=function(){cb(null)};
    img.src=fr.result;
  };
  fr.onerror=function(){cb(null)};
  fr.readAsDataURL(file);
}
function removePhotoUrl(url){
  try{
    var i=String(url||'').indexOf('/'+BUCKET+'/');if(i<0)return;
    var path=decodeURIComponent(url.slice(i+BUCKET.length+2).split('?')[0]);
    sb.storage.from(BUCKET).remove([path]).then(function(){},function(){});
  }catch(e){}
}

/* ---------- submits ---------- */
var BKERR={bad_input:['form','eServer'],hall_unavailable:['form','eHall'],date_past:['date','eDatePast'],date_far:['date','eDateFar'],bad_event:['form','eEvent'],bad_guests:['guests','errGuests'],date_busy:['date','errBusy'],duplicate:['date','errDup'],rate_limit:['form','eRate'],try_again:['form','eNet']};
function submitBooking(){
  var h=S.hall;if(!h||S.sending)return;
  var b=S.bk,er={},ph=cleanPhone(b.phone),g=Number(b.guests),evs=h.events||[],evt=evs.indexOf(b.event)>-1?b.event:evs[0];
  if(!S.sel)er.date=t('errDate');
  else if(S.busy[S.sel])er.date=t('errBusy');
  if(b.name.trim().length<3)er.name=t('errName');
  if(!/^0[567]\d{8}$/.test(ph))er.phone=t('errPhone');
  if(!g||g<10||g%1!==0)er.guests=t('errGuests');else if(g>h.capacity)er.guests=t('errCap',fmt(h.capacity));
  S.err=er;
  if(Object.keys(er).length){render();var f=$('.err');if(f)f.scrollIntoView({block:'center'});return}
  S.sending=true;render();
  var hid=h.id,date=S.sel;
  sb.rpc('create_booking',{p_hall:hid,p_date:date,p_name:b.name.trim(),p_phone:ph,p_event:evt,p_guests:g,p_notes:b.notes.trim()||null}).then(function(r){
    S.sending=false;
    if(r.error){
      var m=String(r.error.message||''),map=BKERR[m];
      if(m==='date_busy'||m==='duplicate'){if(m==='date_busy')S.busy[date]=true;S.sel=''}
      S.err={};
      if(map)S.err[map[0]]=t(map[1]);else S.err.form=t('eNet');
      if(S.hallId===hid&&view()==='hall'){render();var f2=$('.err,.errbox');if(f2)f2.scrollIntoView({block:'center'})}
      return;
    }
    var code=String(r.data||'');
    addMy(code,ph);
    S.flash=code;S.bk.guests='';S.bk.notes='';S.sel='';S.err={};
    toast(t('toastSent'));
    location.hash='bookings';
  },function(){S.sending=false;S.err={form:t('eNet')};if(view()==='hall')render()});
}
function submitTrack(){
  var x=S.tr;if(x.busy)return;
  var code=x.code.trim().toUpperCase(),ph=cleanPhone(x.phone);
  x.err='';
  if(code.length<4)x.err=t('errCode');
  else if(!/^0[567]\d{8}$/.test(ph))x.err=t('errPhone');
  if(x.err){render();return}
  x.busy=true;render();
  sb.rpc('track_bookings',{p_phone:ph,p_codes:[code]}).then(function(r){
    x.busy=false;
    if(r.error)x.err=t('eNet');
    else if(!r.data||!r.data.length)x.err=t('notFoundBk');
    else{addMy(r.data[0].r_code,ph);x.code='';x.err='';S.flash=r.data[0].r_code;toast(t('tTracked'));loadMy()}
    render();
  },function(){x.busy=false;x.err=t('eNet');render()});
}
function submitHall(){
  if(S.saving)return;
  var f=S.of,er={},ph=cleanPhone(f.phone),cap=Number(f.capacity),pr=Number(f.price);
  if(f.name.trim().length<3)er.name=t('eoName');
  if(!f.wilaya)er.wilaya=t('eoWilaya');
  if(f.commune.trim().length<2)er.commune=t('eoCommune');
  if(!cap||cap<20||cap>5000||cap%1!==0)er.capacity=t('eoCap');
  if(!pr||pr<10000||pr>100000000||pr%1!==0)er.price=t('eoPrice');
  if(!/^0\d{8,9}$/.test(ph))er.phone=t('eoPhone');
  if(!f.events.length)er.events=t('eoEvents');
  S.oerr=er;
  if(Object.keys(er).length){render();var x=$('.err');if(x)x.scrollIntoView({block:'center'});return}
  if(!S.user)return;
  S.saving=true;render();
  var editing=S.editing,oldHall=editing?findOH(editing):null,oldPhoto=oldHall?oldHall.photo_url:'';
  var row={name:f.name.trim(),wilaya:f.wilaya,commune:f.commune.trim(),capacity:cap,price:pr,phone:ph,description:f.desc.trim()||null,events:f.events.slice(),features:f.features.slice(),photo_url:f.photoUrl||null};
  var path='',p=Promise.resolve();
  if(f.photoBlob){
    path=S.user.id+'/'+Date.now()+'.jpg';
    p=sb.storage.from(BUCKET).upload(path,f.photoBlob,{contentType:'image/jpeg',cacheControl:'31536000'}).then(function(r){
      if(r.error)throw new Error('upload');
      row.photo_url=sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
    });
  }
  p.then(function(){
    var q=editing?sb.from('halls').update(row).eq('id',editing).select():sb.from('halls').insert(row).select();
    return q.then(function(r){
      if(r.error||!r.data||!r.data.length){if(path)removePhotoUrl('/'+BUCKET+'/'+path);throw new Error('save')}
      if(editing&&oldPhoto&&oldPhoto!==row.photo_url)removePhotoUrl(oldPhoto);
    });
  }).then(function(){
    if(f.photoPrev){try{URL.revokeObjectURL(f.photoPrev)}catch(e){}}
    S.saving=false;S.of=blankForm();S.oerr={};S.adding=false;S.editing='';
    toast(editing?t('tHallSaved'):t('tHallAdded'));
    loadOwner();render();
  }).then(null,function(err){
    S.saving=false;
    toast(err&&err.message==='upload'?t('tUploadFail'):t('tSaveFail'));
    render();
  });
}
